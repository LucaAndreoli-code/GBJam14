name: Setup Godot
description: Cache, install and verify the headless Godot engine plus its matching export templates.

inputs:
  godot-version:
    description: Engine version, e.g. 4.7
    required: true
  godot-release:
    description: Release channel, e.g. stable
    required: false
    default: stable

outputs:
  cache-hit:
    description: true when the engine and export templates were restored from cache
    value: ${{ steps.godot-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Cache Godot and export templates
      id: godot-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/godot-bin
          ~/.local/share/godot/export_templates
        key: godot-${{ inputs.godot-version }}-${{ inputs.godot-release }}

    - name: Install Godot and export templates
      if: steps.godot-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GODOT_FULL: ${{ inputs.godot-version }}-${{ inputs.godot-release }}
        TEMPLATE_DIR_NAME: ${{ inputs.godot-version }}.${{ inputs.godot-release }}
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot/releases/download/${GODOT_FULL}"
        mkdir -p ~/godot-bin "$HOME/.local/share/godot/export_templates"
        curl -fL -o /tmp/godot.zip "${base}/Godot_v${GODOT_FULL}_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d /tmp/godot
        mv "/tmp/godot/Godot_v${GODOT_FULL}_linux.x86_64" ~/godot-bin/godot
        chmod +x ~/godot-bin/godot
        curl -fL -o /tmp/templates.tpz "${base}/Godot_v${GODOT_FULL}_export_templates.tpz"
        unzip -q /tmp/templates.tpz -d /tmp/tpz
        mv /tmp/tpz/templates "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR_NAME}"

    - name: Verify toolchain
      shell: bash
      env:
        TEMPLATE_DIR_NAME: ${{ inputs.godot-version }}.${{ inputs.godot-release }}
      run: |
        set -euo pipefail
        echo "$HOME/godot-bin" >> "$GITHUB_PATH"
        reported="$("$HOME/godot-bin/godot" --version | tail -1 | cut -d. -f1-3)"
        echo "godot reports: ${reported}"
        # The export templates directory name must match the engine version exactly,
        # otherwise every export fails with "No export template found".
        if [[ "${reported}" != "${TEMPLATE_DIR_NAME}" ]]; then
          echo "::error::Engine version '${reported}' does not match template dir '${TEMPLATE_DIR_NAME}'"
          exit 1
        fi
        ls "$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR_NAME}" | head
