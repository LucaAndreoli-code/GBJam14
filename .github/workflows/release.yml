name: Release

on:
  push:
    tags: ['v*']
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push to itch.io (no GitHub Release)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7'
  GODOT_RELEASE: stable
  PROJECT_NAME: GBJAM14
  ITCH_TARGET: m4niek/gbjam14

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Must stay first: `uses: ./.github/actions/...` resolves against the checked-out
      # workspace, so a local action cannot be found before this step runs.
      - uses: actions/checkout@v4

      # Stays inline: the body reads `inputs.publish` from workflow_dispatch, and inside a
      # composite action `inputs` rebinds to that action's own inputs.
      - name: Resolve version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            channel_suffix=""
            publish=true
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            # ci/** branch: publish to the -dev channels, never a GitHub Release.
            version="0.0.0-dev.${GITHUB_SHA::7}"
            channel_suffix="-dev"
            publish=true
          else
            version="0.0.0-dev.${GITHUB_SHA::7}"
            channel_suffix="-dev"
            publish="${{ inputs.publish }}"
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          echo "CHANNEL_SUFFIX=${channel_suffix}" >> "$GITHUB_ENV"
          echo "PUBLISH=${publish}" >> "$GITHUB_ENV"
          echo "Version: ${version} (publish: ${publish}, channel suffix: '${channel_suffix}')"

      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        with:
          godot-version: ${{ env.GODOT_VERSION }}
          godot-release: ${{ env.GODOT_RELEASE }}

      - name: Build
        uses: ./.github/actions/build-godot
        with:
          project-name: ${{ env.PROJECT_NAME }}

      - name: Package
        uses: ./.github/actions/package
        with:
          project-name: ${{ env.PROJECT_NAME }}
          version: ${{ env.VERSION }}

      # Stays a top-level step: a skipped composite action runs none of its own steps, so
      # `if: always()` only survives a build failure out here.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ env.PROJECT_NAME }}-${{ env.VERSION }}
          path: dist/
          if-no-files-found: warn

      # The gates stay on the workflow steps: the `env` context inside a composite action is
      # scoped to that action, so `env.PUBLISH` would read empty there and silently skip.
      - name: Publish to itch.io
        if: env.PUBLISH == 'true'
        uses: ./.github/actions/publish-itch
        with:
          itch-target: ${{ env.ITCH_TARGET }}
          project-name: ${{ env.PROJECT_NAME }}
          version: ${{ env.VERSION }}
          channel-suffix: ${{ env.CHANNEL_SUFFIX }}
          butler-api-key: ${{ secrets.BUTLER_API_KEY }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/github-release
        with:
          project-name: ${{ env.PROJECT_NAME }}
          version: ${{ env.VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
